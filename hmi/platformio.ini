; Contactor IQC Rig - HMI firmware
; Board: Elecrow CrowPanel 7" ESP32-S3 (DIS08070H, V3.0), ESP32-S3-WROOM-1-N4R8
;
; Open this folder (firmware/hmi) in VS Code with the PlatformIO extension,
; then press "Upload" (right arrow in the bottom status bar).

[env:crowpanel7]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; 4 MB flash, 8 MB OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    lovyan03/LovyanGFX@1.1.16
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@7.2.1

monitor_speed = 115200
upload_speed = 921600
; Uncomment and set if PlatformIO picks the wrong port:
; upload_port = COM11
; monitor_port = COM11

; Contactor IQC Rig - sub-board firmware
; Board: ESP32-S3-DevKitC-1
;
; Step 1 (this version): read the 5 INA219 current sensors and print them on
; the Serial Monitor. Relays, continuity inputs and the link to the HMI come next.
;
; Open this folder (rig) in VS Code with PlatformIO, press Upload, then open
; the Serial Monitor (plug icon in the bottom bar).

[env:rig]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Serial goes to the "USB Native" USB-C port (no auto-reset circuit there).
    ; On the 7Semi board the "USB for UART" port holds the chip in reset
    ; whenever a Serial Monitor is open, so use USB Native for everything.
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
; Uncomment and set if PlatformIO picks the wrong port:
; upload_port = COM12
; monitor_port = COM12
